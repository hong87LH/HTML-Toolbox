<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ppt详情页切片整理</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --text:#1f2329;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#2f6fed;
    --primary-soft:#eef4ff;
    --danger:#d9485f;
    --radius:14px;
    --shadow:0 8px 28px rgba(20,30,55,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  .app{max-width:1440px;margin:0 auto;padding:24px}
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;margin-bottom:18px;
  }
  h1{margin:0;font-size:24px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .counter{font-size:13px;color:var(--muted)}
  .layout{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
    gap:18px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .settings{padding:14px;align-self:start;position:sticky;top:14px}
  .export-box{
    margin:-2px -2px 12px;
    padding:12px;
    border:1px solid #dbe6ff;
    background:linear-gradient(180deg,#f7faff 0%,#ffffff 100%);
    border-radius:12px;
  }
  .export-title{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:800;margin-bottom:8px;
  }
  .export-grid{
    display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:8px;align-items:end;
  }
  .export-box .field{margin-top:0}
  .export-box .primary{width:100%;margin-top:9px;height:44px}
  .section{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .section-title{
    font-size:12px;font-weight:700;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  label{font-size:12px;color:#4b5563}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:4px;margin-top:7px}
  input,select,button{
    font:inherit;
  }
  input[type="number"],input[type="text"],select{
    width:100%;
    height:38px;
    border:1px solid var(--line);
    border-radius:9px;
    padding:0 10px;
    outline:none;
    background:white;
    color:var(--text);
  }
  input:focus,select:focus{border-color:#9ab8f6;box-shadow:0 0 0 3px rgba(47,111,237,.10)}
  .seg{
    display:grid;grid-template-columns:repeat(3,1fr);
    border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;
  }
  .seg button{
    height:34px;border:0;background:transparent;border-radius:7px;cursor:pointer;
    font-size:12px;color:#555;
  }
  .seg button.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
  .toggle{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:4px 0 6px;
  }
  .switch{position:relative;width:42px;height:24px;flex:0 0 auto}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#d5d9df;border-radius:20px;cursor:pointer;transition:.2s}
  .slider:before{
    content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s;
  }
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(18px)}
  .hint{font-size:10px;line-height:1.4;color:#8a9099;margin-top:4px}
  .quality-line{display:flex;align-items:center;gap:10px}
  input[type="range"]{width:100%}
  .quality-value{width:44px;text-align:right;font-size:12px;font-weight:700}
  .primary,.secondary{
    border:0;border-radius:10px;height:42px;padding:0 16px;cursor:pointer;font-weight:700;
  }
  .primary{background:var(--primary);color:#fff}
  .primary:hover{filter:brightness(.97)}
  .secondary{background:#f2f4f7;color:#333}
  .primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}

  .workspace{padding:18px;min-height:640px}
  .dropzone{
    border:1.5px dashed #bfc7d4;border-radius:13px;min-height:150px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    background:#fafbfc;cursor:pointer;transition:.18s;
  }
  .dropzone.drag{border-color:var(--primary);background:var(--primary-soft)}
  .drop-icon{font-size:30px;line-height:1}
  .drop-title{font-weight:700;margin-top:8px}
  .drop-desc{font-size:12px;color:var(--muted);margin-top:6px}
  #fileInput{display:none}

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin:16px 0 10px;
  }
  .toolbar-left{font-size:13px;color:var(--muted)}
  .toolbar-right{display:flex;gap:8px}
  .tiny{
    border:1px solid var(--line);background:#fff;height:32px;padding:0 10px;
    border-radius:8px;cursor:pointer;font-size:12px;
  }
  .tiny:hover{background:#f7f8fa}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:12px;
  }
  .card{
    border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
    transition:.16s;
  }
  .card:hover{box-shadow:0 7px 20px rgba(25,35,55,.08);transform:translateY(-1px)}
  .grid.sort-enabled .card{cursor:grab}
  .grid.sort-enabled .card:active{cursor:grabbing}
  .card.dragging{opacity:.38;transform:scale(.985)}
  .card.drag-over{outline:2px solid var(--primary);outline-offset:2px}
  .sort-badge{
    position:absolute;left:42px;top:8px;background:rgba(47,111,237,.92);color:#fff;
    border-radius:6px;font-size:10px;padding:3px 6px;display:none;
  }
  .grid.sort-enabled .sort-badge{display:block}
  .thumb{
    height:172px;background:#eef0f3;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .order{
    position:absolute;left:8px;top:8px;background:rgba(28,32,39,.78);color:#fff;
    border-radius:6px;font-size:11px;padding:3px 6px;
  }
  .remove{
    position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.9);
    width:26px;height:26px;border-radius:7px;cursor:pointer;color:var(--danger);font-weight:700;
  }
  .card-body{padding:10px}
  .meta{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name-input{height:34px!important;font-size:12px!important}
  .empty{
    text-align:center;color:#9aa1aa;padding:84px 20px;font-size:13px;
  }
  .progress-wrap{display:none;margin-top:10px}
  .progress{
    height:7px;background:#edf0f4;border-radius:999px;overflow:hidden;
  }
  .bar{height:100%;width:0;background:var(--primary);transition:width .15s}
  .progress-text{font-size:11px;color:var(--muted);margin-top:6px}
  .status{
    position:fixed;right:24px;bottom:24px;background:#1f2937;color:#fff;
    border-radius:10px;padding:11px 14px;font-size:12px;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
  }
  .status.show{opacity:1;transform:none}
  @media(max-width:880px){
    .layout{grid-template-columns:1fr}
    .settings{position:static}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>ppt详情页切片整理</h1>
      <div class="sub">批量缩放 · 底部白边裁切 · 顺序重命名 · JPG质量 · ZIP导出</div>
    </div>
    <div class="counter" id="counter">0 张图片</div>
  </header>

  <div class="layout">
    <aside class="panel settings">

      <div class="export-box">
        <div class="export-title">
          <span>导出设置</span>
          <span style="font-size:10px;color:var(--muted);font-weight:500">JPG → ZIP</span>
        </div>

        <div class="export-grid">
          <div class="field">
            <label>压缩包名称</label>
            <input type="text" id="zipName" value="ppt详情页切片整理" placeholder="压缩包名称">
          </div>

          <div class="field">
            <label>JPG质量</label>
            <input type="number" id="qualityNumber" value="95" min="50" max="100" step="1">
          </div>
        </div>

        <button class="primary" id="downloadZip" disabled>处理并导出压缩包</button>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress"><div class="bar" id="bar"></div></div>
          <div class="progress-text" id="progressText">准备处理…</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">图片缩放</div>
        <div class="seg">
          <button class="active" data-mode="none">原尺寸</button>
          <button data-mode="width">指定宽度</button>
          <button data-mode="percent">百分比</button>
        </div>

        <div class="field" id="widthField" style="display:none">
          <label>目标宽度（px）</label>
          <input type="number" id="targetWidth" value="950" min="1" step="1">
          <div class="hint">高度按原始比例自动计算。</div>
        </div>

        <div class="field" id="percentField" style="display:none">
          <label>缩放百分比（%）</label>
          <input type="number" id="scalePercent" value="100" min="1" max="1000" step="1">
        </div>
      </div>

      <div class="section">
        <div class="section-title">底边裁切</div>
        <div class="toggle">
          <div>
            <div style="font-size:12px;font-weight:600">裁掉底部连续白色区域</div>
            <div class="hint">默认开启，只裁底部，不动顶部与左右。</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="cropWhite" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="row">
          <div class="field">
            <label>白色阈值</label>
            <input type="number" id="whiteThreshold" value="248" min="200" max="255">
          </div>
          <div class="field">
            <label>每行白像素比例</label>
            <input type="number" id="whiteRatio" value="99.5" min="90" max="100" step="0.1">
          </div>
        </div>
        <div class="hint">例如阈值 248：RGB 都 ≥248 视为白色；一整行中白色像素达到设定比例时视为白边。</div>
      </div>

      <div class="section">
        <div class="section-title">批量命名</div>
        <div class="row">
          <div class="field" style="margin-top:0">
            <label>起始编号</label>
            <input type="number" id="startNumber" value="1" min="0" step="1">
          </div>
          <div class="field" style="margin-top:0">
            <label>编号位数</label>
            <select id="digits">
              <option value="1">1位：1.jpg</option>
              <option value="2" selected>2位：01.jpg</option>
              <option value="3">3位：001.jpg</option>
              <option value="4">4位：0001.jpg</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>文件名前缀（可选）</label>
          <input type="text" id="prefix" placeholder="例如：详情页_">
        </div>
        <button class="secondary" id="applyRename" style="width:100%;margin-top:10px">按当前顺序生成名称</button>
        <div class="hint">生成后仍可在右侧逐张手动修改文件名。</div>
      </div>

      <div class="section">
        <div class="section-title">其他</div>
        <button class="secondary" id="clearAll" disabled style="width:100%;height:36px">清空全部图片</button>
      </div>
    </aside>

    <main class="panel workspace">
      <div class="dropzone" id="dropzone">
        <div>
          <div class="drop-icon">＋</div>
          <div class="drop-title">将图片拖入这里</div>
          <div class="drop-desc">或点击选择图片 · 支持 JPG / PNG / WEBP 等浏览器可读取格式</div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple>

      <div class="toolbar">
        <div class="toolbar-left" id="orderHint">默认按文件名自然顺序导入</div>
        <div class="toolbar-right">
          <button class="tiny" id="toggleSort">开启手动排序</button>
          <button class="tiny" id="renameQuick">重新按序命名</button>
        </div>
      </div>

      <div id="grid" class="grid"></div>
      <div class="empty" id="empty">尚未添加图片</div>
    </main>
  </div>
</div>

<div class="status" id="status"></div>

<script>
const state = {
  files: [],
  resizeMode: 'none',
  manualSort: false
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const dropzone = $('#dropzone');
const fileInput = $('#fileInput');
const grid = $('#grid');
const empty = $('#empty');

function showStatus(msg){
  const el = $('#status');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showStatus.t);
  showStatus.t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function uid(){
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function safeBaseName(name){
  return name.replace(/\.[^.]+$/, '');
}

function normalizeJpgName(name){
  name = (name || '').trim().replace(/[\\/:*?"<>|]/g, '_');
  if(!name) name = 'image';
  return name.replace(/\.(jpeg|jpg|png|webp|bmp|gif)$/i,'') + '.jpg';
}

function normalizeZipName(name){
  name = (name || '').trim().replace(/[\\/:*?"<>|]/g, '_');
  name = name.replace(/\.zip$/i,'').trim();
  if(!name) name = 'ppt详情页切片整理';
  return name + '.zip';
}

function updateUI(){
  $('#counter').textContent = `${state.files.length} 张图片`;
  $('#downloadZip').disabled = !state.files.length;
  $('#clearAll').disabled = !state.files.length;
  empty.style.display = state.files.length ? 'none' : 'block';

  grid.innerHTML = '';
  state.files.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = item.id;
    card.draggable = state.manualSort;
    card.innerHTML = `
      <div class="thumb">
        <img src="${item.url}" alt="">
        <div class="order">#${index + 1}</div>
        <div class="sort-badge">拖拽排序</div>
        <button class="remove" title="删除">×</button>
      </div>
      <div class="card-body">
        <input class="name-input" type="text" value="${escapeHtml(item.outputName)}">
        <div class="meta">${escapeHtml(item.originalName)} · ${item.width || '-'} × ${item.height || '-'}</div>
      </div>`;
    card.querySelector('.remove').onclick = () => removeItem(item.id);
    card.querySelector('.name-input').onchange = e => {
      item.outputName = normalizeJpgName(e.target.value);
      e.target.value = item.outputName;
    };

    if(state.manualSort){
      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragover', handleDragOver);
      card.addEventListener('dragenter', handleDragEnter);
      card.addEventListener('dragleave', handleDragLeave);
      card.addEventListener('drop', handleDrop);
      card.addEventListener('dragend', handleDragEnd);
    }
    grid.appendChild(card);
  });

  grid.classList.toggle('sort-enabled', state.manualSort);
  $('#toggleSort').textContent = state.manualSort ? '关闭手动排序' : '开启手动排序';
  $('#orderHint').textContent = state.manualSort
    ? '手动排序已开启：拖拽图片卡片调整顺序'
    : '默认按文件名自然顺序导入';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function removeItem(id){
  const idx = state.files.findIndex(x => x.id === id);
  if(idx >= 0){
    URL.revokeObjectURL(state.files[idx].url);
    state.files.splice(idx,1);
    updateUI();
  }
}

function naturalFileSort(files){
  return files.sort((a,b) =>
    a.name.localeCompare(
      b.name,
      'zh-CN',
      {numeric:true, sensitivity:'base'}
    )
  );
}

async function addFiles(fileList){
  // Windows 资源管理器拖拽返回顺序并不稳定，因此每一批默认按文件名自然排序。
  const images = naturalFileSort([...fileList].filter(f => f.type.startsWith('image/')));
  if(!images.length){ showStatus('没有识别到可用图片'); return; }

  for(const file of images){
    const url = URL.createObjectURL(file);
    const dims = await getImageSize(url).catch(()=>({width:0,height:0}));
    state.files.push({
      id: uid(),
      file,
      url,
      originalName: file.name,
      outputName: normalizeJpgName(file.name),
      width: dims.width,
      height: dims.height
    });
  }
  updateUI();
  showStatus(`已添加 ${images.length} 张图片`);
}

function getImageSize(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve({width:img.naturalWidth,height:img.naturalHeight});
    img.onerror = reject;
    img.src = url;
  });
}

dropzone.onclick = ()=>fileInput.click();
fileInput.onchange = e => addFiles(e.target.files);

['dragenter','dragover'].forEach(evt=>{
  dropzone.addEventListener(evt,e=>{
    e.preventDefault(); e.stopPropagation(); dropzone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(evt=>{
  dropzone.addEventListener(evt,e=>{
    e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop',e=>addFiles(e.dataTransfer.files));

$$('.seg button').forEach(btn=>{
  btn.onclick = ()=>{
    $$('.seg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.resizeMode = btn.dataset.mode;
    $('#widthField').style.display = state.resizeMode === 'width' ? 'flex' : 'none';
    $('#percentField').style.display = state.resizeMode === 'percent' ? 'flex' : 'none';
  };
});


let draggedId = null;

function handleDragStart(e){
  if(!state.manualSort) return;
  draggedId = this.dataset.id;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedId);
}

function handleDragOver(e){
  if(!state.manualSort) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleDragEnter(e){
  if(!state.manualSort || this.dataset.id === draggedId) return;
  e.preventDefault();
  this.classList.add('drag-over');
}

function handleDragLeave(){
  this.classList.remove('drag-over');
}

function handleDrop(e){
  if(!state.manualSort) return;
  e.preventDefault();
  this.classList.remove('drag-over');

  const targetId = this.dataset.id;
  if(!draggedId || draggedId === targetId) return;

  const fromIndex = state.files.findIndex(x => x.id === draggedId);
  const toIndex = state.files.findIndex(x => x.id === targetId);
  if(fromIndex < 0 || toIndex < 0) return;

  const [moved] = state.files.splice(fromIndex,1);
  state.files.splice(toIndex,0,moved);

  updateUI();
  showStatus('顺序已调整');
}

function handleDragEnd(){
  draggedId = null;
  $$('.card').forEach(card=>{
    card.classList.remove('dragging','drag-over');
  });
}

$('#toggleSort').onclick = ()=>{
  state.manualSort = !state.manualSort;
  updateUI();
  showStatus(state.manualSort ? '手动排序已开启' : '手动排序已关闭');
};

$('#qualityNumber').addEventListener('change', e => {
  let v = parseInt(e.target.value || '95',10);
  v = Math.max(50, Math.min(100, v));
  e.target.value = v;
});

function applySequentialRename(){
  const start = parseInt($('#startNumber').value || '1',10);
  const digits = parseInt($('#digits').value || '2',10);
  const prefix = $('#prefix').value || '';
  state.files.forEach((item, idx)=>{
    const n = String(start + idx).padStart(digits,'0');
    item.outputName = normalizeJpgName(`${prefix}${n}`);
  });
  updateUI();
  showStatus('已按当前顺序重新命名');
}
$('#applyRename').onclick = applySequentialRename;
$('#renameQuick').onclick = applySequentialRename;

$('#clearAll').onclick = ()=>{
  state.files.forEach(x=>URL.revokeObjectURL(x.url));
  state.files = [];
  updateUI();
  showStatus('已清空');
};

function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = err=>{ URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

function findBottomCropY(canvas){
  if(!$('#cropWhite').checked) return canvas.height;

  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const threshold = Math.max(0, Math.min(255, parseInt($('#whiteThreshold').value || '248', 10)));
  const ratioNeed = Math.max(0, Math.min(100, parseFloat($('#whiteRatio').value || '99.5'))) / 100;
  const w = canvas.width, h = canvas.height;

  // 为大图加速：按宽度自适应采样，但仍保持高可靠性。
  const sampleStep = Math.max(1, Math.floor(w / 1800));
  let cropY = h;

  for(let y = h - 1; y >= 0; y--){
    const row = ctx.getImageData(0, y, w, 1).data;
    let white = 0, total = 0;
    for(let x = 0; x < w; x += sampleStep){
      const i = x * 4;
      const a = row[i+3];
      const isWhite = a === 0 || (row[i] >= threshold && row[i+1] >= threshold && row[i+2] >= threshold);
      if(isWhite) white++;
      total++;
    }
    if(total && white / total >= ratioNeed){
      cropY = y;
    }else{
      break; // 只裁“底部连续”的白色区域
    }
  }

  // 防止误判导致空图
  return Math.max(1, cropY);
}

function resizeCanvas(sourceCanvas){
  let targetW = sourceCanvas.width;
  let targetH = sourceCanvas.height;

  if(state.resizeMode === 'width'){
    targetW = Math.max(1, Math.round(parseFloat($('#targetWidth').value || sourceCanvas.width)));
    targetH = Math.max(1, Math.round(sourceCanvas.height * targetW / sourceCanvas.width));
  }else if(state.resizeMode === 'percent'){
    const p = Math.max(0.01, parseFloat($('#scalePercent').value || '100') / 100);
    targetW = Math.max(1, Math.round(sourceCanvas.width * p));
    targetH = Math.max(1, Math.round(sourceCanvas.height * p));
  }

  if(targetW === sourceCanvas.width && targetH === sourceCanvas.height) return sourceCanvas;

  const out = document.createElement('canvas');
  out.width = targetW; out.height = targetH;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sourceCanvas,0,0,targetW,targetH);
  return out;
}

async function processOne(item){
  const img = await loadImageFromFile(item.file);

  const source = document.createElement('canvas');
  source.width = img.naturalWidth;
  source.height = img.naturalHeight;
  const sctx = source.getContext('2d');
  // JPG 无透明通道，先铺白底，避免透明 PNG 导出 JPG 变黑
  sctx.fillStyle = '#ffffff';
  sctx.fillRect(0,0,source.width,source.height);
  sctx.drawImage(img,0,0);

  const cropY = findBottomCropY(source);
  const cropped = document.createElement('canvas');
  cropped.width = source.width;
  cropped.height = cropY;
  const cctx = cropped.getContext('2d');
  cctx.fillStyle = '#ffffff';
  cctx.fillRect(0,0,cropped.width,cropped.height);
  cctx.drawImage(source,0,0,source.width,cropY,0,0,source.width,cropY);

  // 处理顺序：先裁底部白边，再按用户设置缩放
  const finalCanvas = resizeCanvas(cropped);
  const quality = Math.max(.01, Math.min(1, parseInt($('#qualityNumber').value || '95',10)/100));

  const blob = await new Promise(resolve=>finalCanvas.toBlob(resolve,'image/jpeg',quality));
  if(!blob) throw new Error('JPG 导出失败');
  return blob;
}

$('#downloadZip').onclick = async ()=>{
  if(!state.files.length) return;
  if(typeof JSZip === 'undefined'){
    alert('ZIP 组件加载失败。请检查网络后重新打开 HTML。');
    return;
  }

  // 先收集界面中可能尚未失焦的文件名输入
  [...document.querySelectorAll('.name-input')].forEach((input,i)=>{
    if(state.files[i]) state.files[i].outputName = normalizeJpgName(input.value);
  });

  const usedNames = new Map();
  state.files.forEach(item=>{
    const base = normalizeJpgName(item.outputName);
    const count = usedNames.get(base) || 0;
    if(count === 0){
      item._zipName = base;
    }else{
      item._zipName = base.replace(/\.jpg$/i, `_${count+1}.jpg`);
    }
    usedNames.set(base,count+1);
  });

  const btn = $('#downloadZip');
  btn.disabled = true;
  btn.textContent = '处理中…';
  $('#progressWrap').style.display = 'block';

  const zip = new JSZip();
  try{
    for(let i=0;i<state.files.length;i++){
      const item = state.files[i];
      $('#progressText').textContent = `处理 ${i+1} / ${state.files.length}：${item.originalName}`;
      $('#bar').style.width = `${(i/state.files.length)*88}%`;
      await new Promise(r=>setTimeout(r,0));
      const blob = await processOne(item);
      zip.file(item._zipName, blob);
    }

    $('#progressText').textContent = '正在生成 ZIP…';
    $('#bar').style.width = '92%';
    const zipBlob = await zip.generateAsync(
      {type:'blob', compression:'DEFLATE', compressionOptions:{level:6}},
      meta=>{
        $('#bar').style.width = `${92 + meta.percent * .08}%`;
      }
    );

    const a = document.createElement('a');
    const url = URL.createObjectURL(zipBlob);
    a.href = url;
    a.download = normalizeZipName($('#zipName').value);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);

    $('#bar').style.width = '100%';
    $('#progressText').textContent = `完成，共 ${state.files.length} 张`;
    showStatus('ZIP 已生成');
  }catch(err){
    console.error(err);
    alert('处理失败：' + (err?.message || err));
    $('#progressText').textContent = '处理失败';
  }finally{
    btn.disabled = false;
    btn.textContent = '处理并打包 ZIP';
  }
};

updateUI();
</script>
